services:
  - type: web
    name: heatshield-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt && python scripts/init_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: heatshield-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: heatshield-db
    databaseName: heatshield
    user: heatshield
    plan: free
